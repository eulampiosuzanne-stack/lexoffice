<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorizar LexOffice</title><style>body{font-family:Inter,system-ui;background:#0d0d0f;color:#f4f1ed;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,460px);background:#171719;border:1px solid #343438;border-radius:22px;padding:28px;box-sizing:border-box}h1{margin:0 0 8px}.muted{color:#b9b4ae;margin-bottom:22px}input,button{width:100%;padding:14px;margin:7px 0;border-radius:12px;box-sizing:border-box;font-size:16px}input{background:#0f0f11;color:white;border:1px solid #444}button{border:0;background:#8f1d24;color:white;font-weight:700;cursor:pointer}.safe{font-size:13px;color:#9f9a95;margin-top:16px}</style></head><body><main class="card"><h1>LexOffice</h1><div class="muted">Autorizar conexão segura com o ChatGPT</div><form id="f" method="post" action="https://dcpwcuototomxoiszukt.supabase.co/functions/v1/lex-mcp/authorize"><input name="email" type="email" autocomplete="username" placeholder="E-mail da LexOffice" required><input name="password" type="password" autocomplete="current-password" placeholder="Senha da LexOffice" required><button type="submit">Entrar e autorizar</button></form><div class="safe">Sua senha é usada somente para autenticar diretamente na LexOffice e não é enviada ao ChatGPT.</div></main><script>const q=new URLSearchParams(location.search),f=document.getElementById('f');['client_id','redirect_uri','state','code_challenge','resource','scope'].forEach(n=>{const i=document.createElement('input');i.type='hidden';i.name=n;i.value=q.get(n)||'';f.appendChild(i)});</script></body></html>
