<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorizar LexOffice</title><style>body{font-family:Inter,system-ui;background:#0d0d0f;color:#f4f1ed;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,460px);background:#171719;border:1px solid #343438;border-radius:22px;padding:28px;box-sizing:border-box}h1{margin:0 0 8px}.muted{color:#b9b4ae;margin-bottom:22px}button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:12px;background:#8f1d24;color:#fff;font-size:16px;font-weight:700}.safe,.status{font-size:13px;color:#aaa;margin-top:16px}.status{font-size:15px}</style></head><body><main class="card"><h1>LexOffice</h1><div class="muted">Autorizar conexão segura com o ChatGPT</div><button id="google">Continuar com Google</button><div id="status" class="status"></div><div class="safe">A autorização usa a mesma conta Google da LexOffice. Sua senha não é compartilhada com o ChatGPT.</div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const U='https://dcpwcuototomxoiszukt.supabase.co',K='sb_publishable_h1gal1BQha__PKo2_wxY_Q_wZfAqoEm',S=createClient(U,K,{auth:{persistSession:true,detectSessionInUrl:true}}),key='lex_mcp_oauth_pending',st=document.querySelector('#status'),btn=document.querySelector('#google');const q=new URLSearchParams(location.search);if(q.get('client_id'))localStorage.setItem(key,JSON.stringify(Object.fromEntries(q.entries())));const pending=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return{}}};async function hex(v){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}function rnd(){const a=crypto.getRandomValues(new Uint8Array(32));return btoa(String.fromCharCode(...a)).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')}async function finish(){const {data:{session}}=await S.auth.getSession();if(!session)return false;const p=pending();if(!p.client_id||!p.redirect_uri||!p.code_challenge){st.textContent='Dados da autorização expiraram. Volte ao ChatGPT e tente conectar novamente.';return true}st.textContent='Autorizando LexOffice...';const {data:prof,error:pe}=await S.from('profiles').select('org_id').eq('id',session.user.id).maybeSingle();if(pe||!prof?.org_id){st.textContent='Sua conta não possui organização LexOffice vinculada.';return true}const code=rnd(),{error}=await S.from('lex_mcp_oauth_codes').insert({code_hash:await hex(code),org_id:prof.org_id,owner_user_id:session.user.id,client_id:p.client_id,redirect_uri:p.redirect_uri,code_challenge:p.code_challenge,resource:p.resource||'https://dcpwcuototomxoiszukt.supabase.co/functions/v1/lex-mcp',scopes:(p.scope||'lex.read').split(' '),expires_at:new Date(Date.now()+300000).toISOString()});if(error){st.textContent='Não foi possível concluir a autorização: '+error.message;return true}localStorage.removeItem(key);const back=new URL(p.redirect_uri);back.searchParams.set('code',code);if(p.state)back.searchParams.set('state',p.state);back.searchParams.set('iss','https://dcpwcuototomxoiszukt.supabase.co/functions/v1/lex-mcp');location.replace(back.toString());return true}btn.onclick=async()=>{st.textContent='Abrindo Google...';await S.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/mcp-authorize.html'}})};(async()=>{if(await finish())btn.style.display='none'})();</script></body></html>
