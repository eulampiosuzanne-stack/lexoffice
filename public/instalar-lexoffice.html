<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05050A">
  <meta name="application-name" content="LEXOFFICE">
  <link rel="manifest" href="/manifest-admin.webmanifest">
  <link rel="icon" href="/lexoffice-icon.svg" type="image/svg+xml">
  <title>Instalar LEXOFFICE</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#05050a;color:#f5f3ee;font:500 18px/1.55 Inter,Arial,sans-serif}.box{width:min(560px,100%);padding:34px 26px;text-align:center;border:1px solid rgba(212,175,55,.5);border-radius:24px;background:linear-gradient(145deg,#161622,#0e0e16);box-shadow:0 18px 60px #000,0 0 26px rgba(212,175,55,.25)}img{width:94px;height:94px;margin-bottom:12px}h1{margin:0 0 8px;color:#f5d97a;font:600 34px Georgia,serif}p{margin:0 0 24px;color:#c9c6cf}.button{display:block;width:100%;padding:18px;border:0;border-radius:14px;background:linear-gradient(135deg,#d4af37,#f5d97a);color:#05050a;font-size:19px;font-weight:800;text-decoration:none;cursor:pointer;box-shadow:0 0 22px rgba(212,175,55,.35)}#help{margin-top:20px;padding:16px;border:1px solid #2a2a3a;border-radius:14px;text-align:left;color:#f5f3ee;font-size:16px}.hidden{display:none}.open{display:block;margin-top:14px;color:#f5d97a}
  </style>
</head>
<body>
  <main class="box">
    <img src="/lexoffice-icon.svg" alt="LEXOFFICE">
    <h1>LEXOFFICE</h1>
    <p>Painel interno da Dra. Suzanne Figueiredo</p>
    <button id="install" class="button" type="button">Instalar aplicativo</button>
    <div id="help" class="hidden"></div>
    <a class="open" href="/">Abrir a LEXOFFICE sem instalar</a>
  </main>
  <script>
    let promptEvent=null;
    const button=document.getElementById('install');
    const help=document.getElementById('help');
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js?v=9').catch(()=>{});
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();promptEvent=event;button.textContent='Instalar LEXOFFICE';});
    window.addEventListener('appinstalled',()=>{button.textContent='Aplicativo instalado';button.disabled=true;help.classList.add('hidden');});
    button.addEventListener('click',async()=>{
      if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;return;}
      const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
      help.innerHTML=ios?'No iPhone: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.':'No Android: toque no menu <b>⋮</b> do navegador e escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.';
      help.classList.remove('hidden');
    });
  </script>
</body>
</html>
