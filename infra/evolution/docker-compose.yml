# Evolution API v2 para o LexOffice (WhatsApp 4141). Sem segredos: tudo vem do .env (ver .env.example).
# Servicos: evolution-api + postgres + redis. Funciona em qualquer host com Docker Compose (VPS, SnapDeploy, Railway).
services:
  evolution-api:
    image: atendai/evolution-api:v2.2.3   # confirme a tag estavel mais recente antes de publicar
    restart: always
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
volumes:
  evolution_instances:
  postgres_data:
  redis_data:
