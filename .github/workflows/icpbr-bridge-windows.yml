name: ICP-Brasil Bridge Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/icpbr-bridge/**'
      - '.github/workflows/icpbr-bridge-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/icpbr-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build bridge
        run: mvn -B clean package
      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/lexoffice-icpbr-bridge.jar dist/
          '@echo off' | Set-Content dist/iniciar-lexoffice-icpbr.bat
          'set LEXOFFICE_PKCS11_DLL=C:\Windows\System32\aetpkss1.dll' | Add-Content dist/iniciar-lexoffice-icpbr.bat
          'java -jar lexoffice-icpbr-bridge.jar' | Add-Content dist/iniciar-lexoffice-icpbr.bat
          'pause' | Add-Content dist/iniciar-lexoffice-icpbr.bat
      - uses: actions/upload-artifact@v4
        with:
          name: lexoffice-icpbr-bridge-windows
          path: tools/icpbr-bridge/dist/*
