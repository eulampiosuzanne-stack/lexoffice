name: Lex Secretary Supervisor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      - name: Run secretary supervision
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          curl --fail-with-body --silent --show-error \
            -X POST "https://dcpwcuototomxoiszukt.supabase.co/functions/v1/secretary-supervisor" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"org_id":"b3dd3ed0-2a05-4087-8220-307a44352cec"}'
