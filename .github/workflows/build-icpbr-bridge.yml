name: Build ICP-Brasil Bridge
on:
  push:
    paths:
      - 'tools/icpbr-bridge/**'
      - '.github/workflows/build-icpbr-bridge.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build bridge
        working-directory: tools/icpbr-bridge
        run: mvn -B clean package
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item tools/icpbr-bridge/target/lexoffice-icpbr-bridge.jar dist/lexoffice-icpbr-bridge.jar
          '@echo off`r`ntitle LEXOFFICE ICP-Brasil Bridge`r`njava -jar "%~dp0lexoffice-icpbr-bridge.jar"`r`npause' | Set-Content -Encoding ascii dist/Iniciar-LEXOFFICE-ICPBR.bat
          'A ponte abre somente em 127.0.0.1:17681. Conecte o token A3 e execute Iniciar-LEXOFFICE-ICPBR.bat. O PIN e a chave privada nunca saem do computador.' | Set-Content -Encoding utf8 dist/LEIA-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lexoffice-icpbr-bridge-windows
          path: dist/*
          if-no-files-found: error
