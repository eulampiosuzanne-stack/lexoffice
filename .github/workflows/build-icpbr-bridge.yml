name: Build ICP-Brasil Bridge
on:
  push:
    branches: [main]
    paths:
      - 'tools/icpbr-bridge/**'
      - '.github/workflows/build-icpbr-bridge.yml'
  pull_request:
    paths:
      - 'tools/icpbr-bridge/**'
      - '.github/workflows/build-icpbr-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build bridge
        working-directory: tools/icpbr-bridge
        run: mvn -B clean package
      - name: Prepare Windows physical A3 package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item tools/icpbr-bridge/target/lexoffice-icpbr-bridge.jar dist/lexoffice-icpbr-bridge.jar
          Copy-Item tools/icpbr-bridge/README.md dist/LEIA-ME.txt
          @'
          @echo off
          setlocal
          chcp 65001 >nul
          title LEXOFFICE - ICP-Brasil A3
          cd /d "%~dp0"
          set "LEXOFFICE_KEYSTORE_TYPE=PKCS11"
          set "LEXOFFICE_PKCS11_DLL=C:\Windows\System32\aetpkss1.dll"
          if not exist "%LEXOFFICE_PKCS11_DLL%" (
            echo ERRO: SafeSign nao encontrado em %LEXOFFICE_PKCS11_DLL%
            pause
            exit /b 1
          )
          where java >nul 2>nul || (
            echo ERRO: Java nao encontrado.
            pause
            exit /b 1
          )
          echo Iniciando ponte LEXOFFICE em 127.0.0.1:17681...
          echo O PIN fica somente neste computador.
          java -jar "%~dp0lexoffice-icpbr-bridge.jar"
          pause
          '@ | Set-Content -Encoding ascii dist/INICIAR-LEXOFFICE-ICP.bat
      - uses: actions/upload-artifact@v4
        with:
          name: LEXOFFICE-ICP-Brasil-A3-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30
