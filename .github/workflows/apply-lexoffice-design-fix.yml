name: Apply approved LEXOFFICE design fix

on:
  push:
    branches: [design-fix-staging]
    paths:
      - '.lexfix/READY'

permissions:
  contents: write

concurrency:
  group: lexoffice-design-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: design-fix-staging

      - name: Rebuild and verify approved payload
        shell: bash
        run: |
          set -euo pipefail
          cat .lexfix/payload.01 .lexfix/payload.02 .lexfix/payload.03 | base64 -d > /tmp/lexfix.tar.gz
          echo 'dc8e4395c1cbd3bee66c9a30a9bb50a54d8635e97986706df898d12ee56a2f7b  /tmp/lexfix.tar.gz' | sha256sum -c -
          tar -xzf /tmp/lexfix.tar.gz -C .

      - name: Remove deprecated conflicting stylesheets
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            src/accessibility-vision.css \
            src/accessible-final-theme.css \
            src/auth-premium.css \
            src/converge-original-adaptation.css \
            src/glass-premium.css \
            src/legal-office-identity.css \
            src/lex-visual-refresh.css \
            src/lexoffice-reference-layout.css \
            src/luxury-office-theme.css \
            src/mobile-vision-3d.css \
            src/original-layout.css \
            src/pages/consultations.css \
            src/pages/final-polish.css \
            src/pages/luxury-admin-modules.css \
            src/pages/luxury-modules.css \
            src/pages/unified-office-layout.css \
            src/pages/whatsapp-connection-relocation.css \
            src/pwa-fix.css \
            src/reference-ui.css \
            src/sf-brand-theme.css \
            src/sf-table-brand.css \
            src/theme-modes.css

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npm run build

      - name: Commit exact final tree to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lexfix
          rm -f .github/workflows/apply-lexoffice-design-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'style: apply approved unified LEXOFFICE design fix'
          git push origin HEAD:main
