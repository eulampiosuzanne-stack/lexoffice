name: ICP-Brasil Bridge Build
on:
  push:
    paths:
      - 'tools/icpbr-bridge/**'
      - '.github/workflows/icpbr-bridge-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build bridge
        working-directory: tools/icpbr-bridge
        run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: lexoffice-icpbr-bridge-windows
          path: |
            tools/icpbr-bridge/target/lexoffice-icpbr-bridge.jar
            tools/icpbr-bridge/start-windows.bat
          if-no-files-found: error
