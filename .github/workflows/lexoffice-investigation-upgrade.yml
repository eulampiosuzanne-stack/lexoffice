name: LexOffice Investigation Upgrade
on:
  push:
    paths:
      - '.github/workflows/lexoffice-investigation-upgrade.yml'
permissions:
  contents: write
jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Corrigir fechamento JSX e import
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/pages/Consultas.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace(',Download,FileText }', ',Download }')
          s=s.replace('</div>}</>}</section>}</div>}', '</div>}</>}</></section>}</div>}')
          p.write_text(s,encoding='utf-8')
      - run: npm install
      - run: npm run build
      - name: Salvar correção validada
        run: |
          git config user.name 'LexOffice Bot'
          git config user.email 'actions@github.com'
          git add src/pages/Consultas.tsx
          git diff --cached --quiet || git commit -m 'fix: validar interface de investigação'
          git push
